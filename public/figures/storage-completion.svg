<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 568" role="img" aria-labelledby="title desc"><title id="title">A request has a lifetime</title><desc id="desc">01 / REQUEST. Client submits a read. A provider owns a pending operation. 02 / DATA. Provider completes the transfer. Bytes alone do not complete the contract. 03 / COMPLETION. Return through a deferred context. Arguments, lifetime and ordering must agree. Synchronous re-entry can grow the kernel stack.</desc><rect width="440" height="568" fill="#e8edf2"/><g font-family="system-ui,sans-serif" fill="#15212e"><text x="28" y="38" font-size="17" font-weight="600">A request has a lifetime</text><rect x="28" y="65" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="94" font-family="monospace" font-size="12" fill="#2445c5">01 / REQUEST</text><text x="46" y="125" font-size="18" font-weight="600">Client submits a read</text><text x="46" y="153" font-size="13" fill="#53616d">A provider owns a pending operation.</text><path d="M220 180v27m-5-5 5 5 5-5" fill="none" stroke="#2445c5" stroke-width="1.5"/><rect x="28" y="216" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="245" font-family="monospace" font-size="12" fill="#2445c5">02 / DATA</text><text x="46" y="276" font-size="18" font-weight="600">Provider completes the transfer</text><text x="46" y="304" font-size="13" fill="#53616d">Bytes alone do not complete the contract.</text><path d="M220 331v27m-5-5 5 5 5-5" fill="none" stroke="#2445c5" stroke-width="1.5"/><rect x="28" y="367" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="396" font-family="monospace" font-size="12" fill="#2445c5">03 / COMPLETION</text><text x="46" y="427" font-size="18" font-weight="600">Return through a deferred context</text><text x="46" y="455" font-size="13" fill="#53616d">Arguments, lifetime and ordering must agree.</text><text x="28" y="548" font-size="13" fill="#53616d">Synchronous re-entry can grow the kernel stack.</text></g></svg>

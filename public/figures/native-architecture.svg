<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc"><title id="title">Native runtime and separate boot/recovery stages</title><desc id="desc">Explanatory architecture of the 7E18 A64 route; the pre-XNU NuttX selector, resident EL2 compatibility and separate Jumpdrive recovery have distinct lifetimes.</desc><rect width="960" height="660" fill="#f5f8fb"/><g font-family="Arial, sans-serif"><text x="32" y="38" fill="#3568b5" font-size="14" letter-spacing="2">7E18 / PHYSICAL PINEPHONE</text><rect x="44" y="62" width="580" height="72" rx="5" fill="#fff" stroke="#bac9d5"/><text x="62" y="90" fill="#173653" font-size="19" font-weight="600">Stock applications and frameworks</text><text x="62" y="114" fill="#21384f" font-size="13" >SpringBoard · Camera · Photos · Celestial / FigRecorder</text><path d="M334 137v18m-5-5 5 5 5-5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="44" y="159" width="580" height="72" rx="5" fill="#e0eafa" stroke="#3568b5"/><text x="62" y="187" fill="#173653" font-size="19" font-weight="600">Original IOKit hardware providers</text><text x="62" y="211" fill="#21384f" font-size="13" >MMC / explicit-key AES · display · input / power · H1ISP / JPEG</text><path d="M334 234v18m-5-5 5 5 5-5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="44" y="256" width="580" height="72" rx="5" fill="#fff" stroke="#bac9d5"/><text x="62" y="284" fill="#173653" font-size="19" font-weight="600">Adapted original XNU · AArch32</text><text x="62" y="308" fill="#21384f" font-size="13" >7E18 / XNU 1357 · exact-build guards and bindings</text><path d="M334 331v18m-5-5 5 5 5-5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="44" y="353" width="580" height="72" rx="5" fill="#fff" stroke="#bac9d5"/><text x="62" y="381" fill="#173653" font-size="19" font-weight="600">Resident EL2 compatibility / reset</text><text x="62" y="405" fill="#21384f" font-size="13" >Selective architectural handling · final drained WDOG0 reset</text><path d="M334 428v18m-5-5 5 5 5-5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="44" y="450" width="580" height="72" rx="5" fill="#e0eafa" stroke="#3568b5"/><text x="62" y="478" fill="#173653" font-size="19" font-weight="600">A64 hardware · Cortex-A53</text><text x="62" y="502" fill="#21384f" font-size="13" >Physical execution · MMIO / DMA / panel / sensor / PMIC</text><rect x="658" y="62" width="258" height="90" rx="5" fill="#fff" stroke="#bac9d5"/><text x="676" y="90" fill="#173653" font-size="19" font-weight="600">Boot-time preparation</text><text x="676" y="114" fill="#21384f" font-size="13" >Tow-Boot / TF-A → NuttX</text><text x="676" y="133" fill="#21384f" font-size="13" >Panel initialization + selector</text><path d="M658 179L642 179" stroke="#59768f" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M642 179L642 292" stroke="#59768f" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M642 292L624 292" stroke="#59768f" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="658" y="222" width="258" height="82" rx="5" fill="#fff" stroke="#bac9d5"/><text x="676" y="250" fill="#173653" font-size="19" font-weight="600">Checked profile staging</text><text x="676" y="274" fill="#21384f" font-size="13" >Kernel identity · separate OS window</text><rect x="658" y="353" width="258" height="90" rx="5" fill="#fff" stroke="#bac9d5"/><text x="676" y="381" fill="#173653" font-size="19" font-weight="600">Recovery after reset</text><text x="676" y="405" fill="#21384f" font-size="13" >RTC route → Jumpdrive Linux</text><text x="676" y="424" fill="#21384f" font-size="13" >Fresh hashes / filesystem checks</text><path d="M624 389L658 389" stroke="#59768f" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="44" y="566" fill="#3568b5" font-size="14" font-weight="600">BOOT-TIME ≠ RESIDENT RUNTIME ≠ RECOVERY</text><text x="44" y="592" fill="#21384f" font-size="15" >NuttX prepares the display before XNU; Jumpdrive is a separate recovery OS.</text><text x="44" y="618" fill="#21384f" font-size="15" >Ordinary AArch32 instructions execute on A53. This is not a complete Apple board model.</text></g></svg>

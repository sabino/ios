<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 568" role="img" aria-labelledby="title desc"><title id="title">Three ownership boundaries</title><desc id="desc">01 / GUEST SURFACE. Original graphics client. The bytes requested by the client. 02 / SHARED STORAGE. Backed pages + valid mapping. Ownership and addressability both matter. 03 / PHYSICAL SCANOUT. Display engine + panel. Presentation is a separate hardware result. A valid surface is not yet a visible frame.</desc><rect width="440" height="568" fill="#e8edf2"/><g font-family="system-ui,sans-serif" fill="#15212e"><text x="28" y="38" font-size="17" font-weight="600">Three ownership boundaries</text><rect x="28" y="65" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="94" font-family="monospace" font-size="12" fill="#2445c5">01 / GUEST SURFACE</text><text x="46" y="125" font-size="18" font-weight="600">Original graphics client</text><text x="46" y="153" font-size="13" fill="#53616d">The bytes requested by the client.</text><path d="M220 180v27m-5-5 5 5 5-5" fill="none" stroke="#2445c5" stroke-width="1.5"/><rect x="28" y="216" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="245" font-family="monospace" font-size="12" fill="#2445c5">02 / SHARED STORAGE</text><text x="46" y="276" font-size="18" font-weight="600">Backed pages + valid mapping</text><text x="46" y="304" font-size="13" fill="#53616d">Ownership and addressability both matter.</text><path d="M220 331v27m-5-5 5 5 5-5" fill="none" stroke="#2445c5" stroke-width="1.5"/><rect x="28" y="367" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="396" font-family="monospace" font-size="12" fill="#2445c5">03 / PHYSICAL SCANOUT</text><text x="46" y="427" font-size="18" font-weight="600">Display engine + panel</text><text x="46" y="455" font-size="13" fill="#53616d">Presentation is a separate hardware result.</text><text x="28" y="548" font-size="13" fill="#53616d">A valid surface is not yet a visible frame.</text></g></svg>

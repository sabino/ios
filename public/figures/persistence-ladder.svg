<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 568" role="img" aria-labelledby="title desc"><title id="title">Stronger claims need more evidence</title><desc id="desc">01 / MOUNT. The filesystem is recognized. Does not establish a healthy writable volume. 02 / REOPEN. A written file survives a reset. A narrow persistence observation. 03 / CHECK. Recovery examines the whole volume. Still bounded by the workload and run length. Each step answers a different question.</desc><rect width="440" height="568" fill="#e8edf2"/><g font-family="system-ui,sans-serif" fill="#15212e"><text x="28" y="38" font-size="17" font-weight="600">Stronger claims need more evidence</text><rect x="28" y="65" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="94" font-family="monospace" font-size="12" fill="#2445c5">01 / MOUNT</text><text x="46" y="125" font-size="18" font-weight="600">The filesystem is recognized</text><text x="46" y="153" font-size="13" fill="#53616d">Does not establish a healthy writable volume.</text><path d="M220 180v27m-5-5 5 5 5-5" fill="none" stroke="#2445c5" stroke-width="1.5"/><rect x="28" y="216" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="245" font-family="monospace" font-size="12" fill="#2445c5">02 / REOPEN</text><text x="46" y="276" font-size="18" font-weight="600">A written file survives a reset</text><text x="46" y="304" font-size="13" fill="#53616d">A narrow persistence observation.</text><path d="M220 331v27m-5-5 5 5 5-5" fill="none" stroke="#2445c5" stroke-width="1.5"/><rect x="28" y="367" width="384" height="115" fill="#fafbfc" stroke="#c1ccd7"/><text x="46" y="396" font-family="monospace" font-size="12" fill="#2445c5">03 / CHECK</text><text x="46" y="427" font-size="18" font-weight="600">Recovery examines the whole volume</text><text x="46" y="455" font-size="13" fill="#53616d">Still bounded by the workload and run length.</text><text x="28" y="548" font-size="13" fill="#53616d">Each step answers a different question.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="title desc"><title id="title">Bounded physical trial loop</title><desc id="desc">Freeze and preflight, bounded capture, separate recovery, fresh integrity checks and owner hand acceptance; failures return to diagnosis.</desc><rect width="960" height="410" fill="#f5f8fb"/><g font-family="Arial, sans-serif"><text x="30" y="35" fill="#3568b5" font-size="14" letter-spacing="1">EACH TRIAL DECLARES ITS OWN WRITE AND RECOVERY SCOPE</text><rect x="30" y="64" width="275" height="78" rx="5" fill="#fff" stroke="#bac9d5"/><text x="48" y="92" fill="#173653" font-size="19" font-weight="600">1. Freeze + preflight</text><text x="48" y="116" fill="#21384f" font-size="13" >Exact inputs · read-only baselines</text><path d="M309 103h18m-5-5 5 5-5 5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="342" y="64" width="275" height="78" rx="5" fill="#e0eafa" stroke="#3568b5"/><text x="360" y="92" fill="#173653" font-size="19" font-weight="600">2. Boot + capture</text><text x="360" y="116" fill="#21384f" font-size="13" >Exclusive UART · finite diagnostics</text><path d="M622 103h18m-5-5 5 5-5 5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="654" y="64" width="275" height="78" rx="5" fill="#fff" stroke="#bac9d5"/><text x="672" y="92" fill="#173653" font-size="19" font-weight="600">3. Recover</text><text x="672" y="116" fill="#21384f" font-size="13" >Watchdog / RTC → Jumpdrive</text><path d="M790 150v18m-5-5 5 5 5-5" stroke="#59768f" fill="none" stroke-width="2"/><path d="M790 168L790 208" stroke="#59768f" stroke-width="2" fill="none" /><rect x="654" y="226" width="275" height="78" rx="5" fill="#e0eafa" stroke="#3568b5"/><text x="672" y="254" fill="#173653" font-size="19" font-weight="600">4. Fresh readback</text><text x="672" y="278" fill="#21384f" font-size="13" >Immutable hashes · fsck · media</text><path d="M645 265L620 265" stroke="#59768f" stroke-width="2" fill="none" /><rect x="342" y="226" width="275" height="78" rx="5" fill="#fff" stroke="#bac9d5"/><text x="360" y="254" fill="#173653" font-size="19" font-weight="600">5. Owner acceptance</text><text x="360" y="278" fill="#21384f" font-size="13" >Visible use · separate hand result</text><path d="M330 265L307 265" stroke="#59768f" stroke-width="2" fill="none" /><rect x="30" y="226" width="275" height="78" rx="5" fill="#fff" stroke="#bac9d5"/><text x="48" y="254" fill="#173653" font-size="19" font-weight="600">6. Record the boundary</text><text x="48" y="278" fill="#21384f" font-size="13" >Accepted scope + retained failure</text><path d="M168 219L168 147" stroke="#59768f" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="30" y="347" fill="#21384f" font-size="16" >Failure → diagnosis → a newly frozen trial, without overwriting the old conclusion.</text><text x="30" y="375" fill="#21384f" font-size="15" >Accepted normal profiles keep boot/runtime watchdogs off; diagnostic leases are finite.</text></g></svg>

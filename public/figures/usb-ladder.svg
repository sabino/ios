<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc"><title id="title">USB progress ends before ordinary pairing</title><desc id="desc">Enumeration and stock mux handshake pass in finite physical trials; listener timing is sampled, while pairing and AFC remain pending.</desc><rect width="960" height="390" fill="#f5f8fb"/><g font-family="Arial, sans-serif"><text x="30" y="35" fill="#3568b5" font-size="14" letter-spacing="1">7E18 PHYSICAL USB / SEPARATE TRIALS, SEPARATE GATES</text><rect x="30" y="69" width="275" height="86" rx="5" fill="#e0eafa" stroke="#3568b5"/><text x="48" y="97" fill="#173653" font-size="19" font-weight="600">1. EP0 + enumeration</text><text x="48" y="121" fill="#21384f" font-size="13" >Address / descriptors / configuration</text><text x="49" y="138" fill="#21384f" font-size="13" >Passed in later finite trials</text><path d="M310 112h18m-5-5 5 5-5 5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="342" y="69" width="275" height="86" rx="5" fill="#e0eafa" stroke="#3568b5"/><text x="360" y="97" fill="#173653" font-size="19" font-weight="600">2. Stock mux v2</text><text x="360" y="121" fill="#21384f" font-size="13" >Real family / native bulk transport</text><text x="360" y="138" fill="#21384f" font-size="13" >Handshake passed; pairing pending</text><path d="M622 112h18m-5-5 5 5-5 5" stroke="#59768f" fill="none" stroke-width="2"/><rect x="654" y="69" width="275" height="86" rx="5" fill="#fff" stroke="#bac9d5"/><text x="672" y="97" fill="#173653" font-size="19" font-weight="600">3. Local listener</text><text x="672" y="121" fill="#21384f" font-size="13" >First positive sample after startup</text><text x="672" y="138" fill="#21384f" font-size="13" >41.237 s · not exact bind time</text><rect x="342" y="223" width="587" height="85" rx="5" fill="#fff" stroke="#bac9d5"/><text x="360" y="251" fill="#173653" font-size="19" font-weight="600">4. Ordinary pairing → information / syslog / AFC</text><text x="360" y="275" fill="#21384f" font-size="13" >PENDING · identity stability, service lifetime and replug acceptance</text><path d="M792 162L792 218" stroke="#59768f" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="30" y="245" fill="#3568b5" font-size="17" font-weight="600">Retained failures</text><text x="30" y="273" fill="#21384f" font-size="13" >Address timing / DATAEND</text><text x="30" y="296" fill="#21384f" font-size="13" >Fixed 30 s delay / refusal</text><text x="30" y="351" fill="#21384f" font-size="15" >Scoped diagnostic success coexists with a false original whole-run capture gate.</text></g></svg>

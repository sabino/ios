<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc"><title id="title">Idle display elapsed work and separate logging cost</title><desc id="desc">Sixty-four later physical presentations with zero sampled changes; logging has only one sample.</desc><rect width="960" height="450" fill="#f5f8fb"/><g font-family="Arial, sans-serif"><text x="30" y="35" fill="#3568b5" font-size="14" letter-spacing="1">7E18 IDLE DISPLAY / 64 LATER PRESENTATIONS</text><text x="30" y="99" fill="#21384f" font-size="16" >Source work</text><rect x="245" y="78" height="28" width="182.11128906250002" fill="#8ab2e4"/><text x="438.1112890625" y="98" fill="#21384f" font-size="14" >4.7924 ms</text><text x="30" y="155" fill="#21384f" font-size="16" >2× expansion</text><rect x="245" y="134" height="28" width="296.94073307291666" fill="#8ab2e4"/><text x="552.9407330729166" y="154" fill="#21384f" font-size="14" >7.8142 ms</text><text x="30" y="211" fill="#21384f" font-size="16" >Total work</text><rect x="245" y="190" height="28" width="482.3614856770833" fill="#3568b5"/><text x="738.3614856770832" y="210" fill="#21384f" font-size="14" >12.6937 ms</text><text x="30" y="267" fill="#21384f" font-size="16" >Presentation gap</text><rect x="245" y="246" height="28" width="488.82294531250005" fill="#8ab2e4"/><text x="744.8229453125" y="266" fill="#21384f" font-size="14" >12.8638 ms</text><text x="30" y="336" fill="#3568b5" font-size="17" font-weight="600">Log: 72.3972 ms · ONE SAMPLE</text><text x="30" y="369" fill="#21384f" font-size="15" >The log is reported separately, not plotted against the 64-sample work means.</text><text x="30" y="409" fill="#21384f" font-size="14" >Zero sampled changes · elapsed counter timing · no clock or cache-policy change.</text></g></svg>
